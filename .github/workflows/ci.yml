name: Staff Pulse CI

# Запускаем конвейер проверок при каждом пуше и PR в главные ветки
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Сборка и проверка бэкенда на Go
  backend-ci:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          cd backend
          go mod download

      - name: Go Code Quality (Vet)
        run: |
          cd backend
          go vet ./...

      - name: Compile Go Server
        run: |
          cd backend
          go build -o server cmd/server/main.go

  # 2. Проверка типов и запуск тестов фронтенда
  frontend-ci:
    name: Frontend CI (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: TypeScript Compiler Check (Typecheck)
        run: |
          cd client
          npx tsc -b

      - name: Run Unit Tests (Vitest)
        run: |
          cd client
          npx vitest run
